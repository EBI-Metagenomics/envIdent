report_comment: >
  This report has been generated by the <a href="https://github.com/EBI-Metagenomics/envident/" target="_blank">EBI-Metagenomics/envident</a>
  analysis pipeline.
# Keep the report in pipeline order, with run metadata below the QC sections.
report_section_order:
  fastqc_raw:
    order: 700
  fastp_initial:
    order: 600
  cutadapt_first_pass:
    order: 500
  cutadapt_second_pass:
    order: 400
  fastqc_clean:
    order: 300
  fastp_beforehmm:
    order: 200
  dada2_qc:
    order: 100
  software_versions:
    order: -1001
  EBI-Metagenomics-envident-summary:
    order: -1002
  EBI-Metagenomics-envident-methods-description:
    order: -1003

module_order:
  - fastqc:
      name: "FastQC (Raw Reads)"
      anchor: "fastqc_raw"
      path_filters:
        - "*/fastqc_raw/*"
        - "*raw*fastqc*"
  - fastp:
      name: "Fastp (Raw Reads)"
      anchor: "fastp_initial"
      path_filters_exclude:
        - "*beforehmm*"
  - cutadapt:
      name: "Cutadapt (First Pass)"
      anchor: "cutadapt_first_pass"
      path_filters:
        - "*first_pass.cutadapt.json"
  - cutadapt:
      name: "Cutadapt (Second Pass)"
      anchor: "cutadapt_second_pass"
      path_filters:
        - "*second_pass.cutadapt.json"
  - fastqc:
      name: "FastQC (Clean Reads)"
      anchor: "fastqc_clean"
      path_filters:
        - "*/fastqc_clean/*"
        - "*clean*fastqc*"
  - fastp:
      name: "Fastp (Pre-HMM)"
      anchor: "fastp_beforehmm"
      path_filters:
        - "*beforehmm*"

# Use report filenames for Cutadapt rather than concatenating the two input mates.
use_filename_as_sample_name:
  - cutadapt
extra_fn_clean_exts:
  - type: regex
    pattern: '\.cutadapt\.json$'
    module: [cutadapt_first_pass, cutadapt_second_pass]

remove_sections:
  - cutadapt_first_pass_cutadapt_trimmed_sequences
  - cutadapt_first_pass_cutadapt_trimmed_sequences_5
  - cutadapt_first_pass_cutadapt_trimmed_sequences_3
  - cutadapt_second_pass_cutadapt_trimmed_sequences
  - cutadapt_second_pass_cutadapt_trimmed_sequences_5
  - cutadapt_second_pass_cutadapt_trimmed_sequences_3

export_plots: true

disable_version_detection: true

show_analysis_paths: false
